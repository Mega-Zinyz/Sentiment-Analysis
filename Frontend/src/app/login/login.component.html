<div class="app-component" data-component="login">
<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>🔐 Login</h1>
      <p>Masuk ke akun analisis sentimen Anda</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username">Nama Pengguna</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          placeholder="Masukkan nama pengguna"
          class="form-input"
          required
          [disabled]="loading">
      </div>

      <div class="form-group">
        <label for="password">Kata Sandi</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Masukkan kata sandi"
          class="form-input"
          required
          [disabled]="loading">
      </div>

      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>

      <button
        type="submit"
        class="login-button"
        [disabled]="loading || !username || !password">
        <span *ngIf="loading">⏳ Memproses...</span>
        <span *ngIf="!loading">🚀 Masuk</span>
      </button>
    </form>

    <div class="login-footer">
      <p>Belum punya akun?</p>
      <button type="button" (click)="goToRegister()" class="register-link" [disabled]="loading">
        📝 Buat Akun
      </button>
    </div>
  </div>
</div>
</div>
