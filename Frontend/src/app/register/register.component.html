<div class="app-component" data-component="register">
<div class="register-container">
  <div class="register-card">
    <div class="register-header">
      <h1>📝 Buat Akun</h1>
      <p>Bergabung dengan platform analisis sentimen</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="register-form">
      <div class="form-group">
        <label for="username">Nama Pengguna</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          placeholder="Pilih nama pengguna"
          class="form-input"
          required
          [disabled]="loading">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Masukkan email Anda"
          class="form-input"
          required
          [disabled]="loading">
      </div>

      <div class="form-group">
        <label for="password">Kata Sandi</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Buat kata sandi"
          class="form-input"
          required
          [disabled]="loading">
        <small class="form-help">Minimal 6 karakter</small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Konfirmasi Kata Sandi</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="Konfirmasi kata sandi Anda"
          class="form-input"
          required
          [disabled]="loading">
      </div>

      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>

      <button
        type="submit"
        class="register-button"
        [disabled]="loading || !username || !email || !password || !confirmPassword">
        <span *ngIf="loading">⏳ Membuat Akun...</span>
        <span *ngIf="!loading">🚀 Buat Akun</span>
      </button>
    </form>

    <div class="register-footer">
      <p>Sudah punya akun?</p>
      <button type="button" (click)="goToLogin()" class="login-link" [disabled]="loading">
        🔐 Masuk
      </button>
    </div>
  </div>
</div>
</div>
