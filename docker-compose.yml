services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: sentiment-mysql
    command: --default-authentication-plugin=caching_sha2_password
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-h4gg4102}
      MYSQL_DATABASE: ${DB_NAME:-sentiment_analysis}
      MYSQL_USER: ${DB_USER:-Logius}
      MYSQL_PASSWORD: ${DB_PASSWORD:-maret1990}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sentiment-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: sentiment-redis
    volumes:
      - redis_data:/data
    networks:
      - sentiment-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: sentiment-backend
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-5000}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-Logius}
      DB_PASSWORD: ${DB_PASSWORD:-maret1990}
      DB_NAME: ${DB_NAME:-sentiment_analysis}
      JWT_SECRET: ${JWT_SECRET:-1mmortalwithinfinitelife}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-N3verdi3}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://31.97.108.201,http://31.97.108.201}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
      CRAWLER_HEADLESS: "true"
      CRAWLER_TIMEOUT: "30000"
      CRAWLER_RATE_LIMIT: "5000"
      CRAWLER_MAX_RETRIES: "3"
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./Backend/config:/app/config
      - ./Backend/python:/app/python
      - ./Backend/logs:/app/logs
      - ./Backend/temp:/app/temp
    networks:
      - sentiment-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 1G

  # Frontend (Angular + Nginx)
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: sentiment-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./Frontend/ssl:/etc/nginx/ssl
    depends_on:
      - backend
    networks:
      - sentiment-network
    restart: unless-stopped

networks:
  sentiment-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local