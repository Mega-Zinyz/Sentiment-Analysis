services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: sentiment-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-sentiment_analysis_rootismtm}
      MYSQL_DATABASE: ${DB_NAME:-sentiment_analysis}
      MYSQL_USER: ${DB_USER:-sentiment_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sentiment_passtoriation}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sentiment-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - For Bull job queue
  redis:
    image: redis:7-alpine
    container_name: sentiment-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sentiment-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: sentiment-backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-5000}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-sentiment_user}
      DB_PASSWORD: ${DB_PASSWORD:-sentiment_passtoriation}
      DB_NAME: ${DB_NAME:-sentiment_analysis}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-this}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-your-encryption-key-change-this}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:4200}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Crawler/Playwright settings
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
      CRAWLER_HEADLESS: "true"
      CRAWLER_TIMEOUT: "30000"
      CRAWLER_RATE_LIMIT: "2000"
      CRAWLER_MAX_RETRIES: "3"
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./Backend/config:/app/config
      - ./Backend/python:/app/python
      - ./Backend/logs:/app/logs
      - ./Backend/temp:/app/temp
    networks:
      - sentiment-network
    restart: unless-stopped
    # Resource limits for Playwright/Chromium
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 1G

  # Frontend (Angular + Nginx)
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: sentiment-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sentiment-network
    restart: unless-stopped

networks:
  sentiment-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local