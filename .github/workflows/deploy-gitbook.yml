name: Deploy GitBook Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '*.md'
      - 'book.json'
      - 'SUMMARY.md'
      - 'styles/**'
      - '.github/workflows/deploy-gitbook.yml'
  workflow_dispatch:

jobs:
  deploy-gitbook:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install Honkit (GitBook alternative)
        run: |
          npm install -g honkit
          honkit --version
      
      - name: Install Honkit plugins
        run: |
          honkit install
        continue-on-error: true
      
      - name: Build documentation
        run: |
          honkit build . _book
      
      - name: Add .nojekyll file
        run: touch _book/.nojekyll
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'docs: Deploy GitBook documentation [skip ci]'
          force_orphan: true
