name: Deploy GitBook Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '*.md'
      - 'book.json'
      - 'SUMMARY.md'
      - '.github/workflows/deploy-gitbook.yml'
  workflow_dispatch:

jobs:
  deploy-gitbook:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '14'
      
      - name: Install GitBook CLI
        run: |
          npm install -g gitbook-cli
          gitbook -V
      
      - name: Install GitBook plugins
        run: gitbook install
      
      - name: Build GitBook
        run: gitbook build
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
          cname: docs.yourdomain.com  # Optional: Add your custom domain
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy GitBook documentation'
