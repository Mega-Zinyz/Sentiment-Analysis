name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        working-directory: Backend
        run: npm ci

      - name: Run unit tests
        working-directory: Backend
        run: npm test

  api-tests:
    name: API Tests (Postman/Newman)
    runs-on: ubuntu-latest
    needs: backend-unit-tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sentiment_analysis
          MYSQL_USER: sentiment_user
          MYSQL_PASSWORD: sentiment_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: sentiment_user
      DB_PASSWORD: sentiment_pass
      DB_NAME: sentiment_analysis
      JWT_SECRET: ci-test-jwt-secret
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcd
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      PORT: 5000
      NODE_ENV: test
      ALLOWED_ORIGINS: http://localhost:5000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        working-directory: Backend
        run: npm ci

      - name: Start backend server in the background
        working-directory: Backend
        run: nohup npm start > backend.log 2>&1 &

      - name: Wait for the backend to report healthy
        run: npx --yes wait-on http://127.0.0.1:5000/health -t 60000

      - name: Run Postman/Newman API tests
        working-directory: Backend
        run: npm run test:api

      - name: Show backend logs on failure
        if: failure()
        run: cat Backend/backend.log || true

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: backend-unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Build and start the full stack
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build

      - name: Wait for the frontend to be reachable
        run: npx --yes wait-on http://localhost -t 300000

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Show backend container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml logs backend

      - name: Tear down the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml down -v
